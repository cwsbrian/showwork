<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Showwork · 함께 보는 작업</title>
  <style>
    :root { color-scheme: light; --ink:#172f34; --muted:#52696b; --line:#d9e3e0; --accent:#116e60; --wash:#eef3f0; }
    * { box-sizing:border-box; } body { margin:0; background:var(--wash); color:var(--ink); font:16px/1.6 system-ui,sans-serif; }
    header { background:#fff; border-bottom:1px solid var(--line); padding:19px max(24px,calc((100vw - 1180px)/2)); display:flex; justify-content:space-between; align-items:center; gap:18px; }
    .brand { font-size:21px; font-weight:800; letter-spacing:-.7px; } .brand span { color:var(--accent); } #connection { font-size:13px; color:var(--muted); }
    main { max-width:1236px; padding:48px 28px 80px; margin:auto; } .eyebrow { color:var(--accent); font-size:12px; font-weight:800; letter-spacing:2px; text-transform:uppercase; }
    h1 { font-size:clamp(28px,4vw,46px); letter-spacing:-1.8px; line-height:1.2; max-width:960px; margin:12px 0 16px; } h2 { font-size:23px; letter-spacing:-.5px; } h3 { font-size:18px; margin:0 0 8px; }
    #summary { color:var(--muted); max-width:820px; margin:0 0 32px; white-space:pre-wrap; } .section-grid, .options { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,390px),1fr)); gap:22px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:15px; overflow:hidden; min-width:0; } .card-copy { padding:23px; } .card p { margin:0; color:var(--muted); white-space:pre-wrap; }
    .section-grid.handoff { grid-template-columns:1fr; } .card { scroll-margin-top:20px; }
    #contents { display:flex; flex-wrap:wrap; gap:10px 18px; margin:0 0 26px; } #contents a { color:var(--accent); text-underline-offset:4px; }
    .tag { display:inline-block; font-size:11px; font-weight:750; letter-spacing:.7px; color:var(--accent); margin:0 0 10px; }
    iframe { width:100%; min-height:260px; border:0; display:block; background:#fff; border-bottom:1px solid var(--line); } .visual-image { display:block; width:100%; max-height:560px; object-fit:contain; background:#f7f9f7; border-bottom:1px solid var(--line); }
    .option { cursor:pointer; outline:0; position:relative; } .option:focus-visible { box-shadow:0 0 0 4px #65cdb7; } .option[aria-checked="true"] { border:2px solid var(--accent); box-shadow:0 8px 24px #116e6014; } .option iframe, .option img { pointer-events:none; }
    .option-label { display:flex; align-items:center; gap:12px; } .radio { width:18px; height:18px; border:2px solid #9aadaa; border-radius:50%; flex-shrink:0; } [aria-checked="true"] .radio { border:5px solid var(--accent); }
    #decision { margin:0 0 36px; } #question { margin-top:0; } .decision-actions { display:flex; flex-wrap:wrap; align-items:center; gap:16px; margin-top:22px; }
    button { border:0; border-radius:9px; padding:12px 22px; background:var(--accent); color:#fff; font:600 15px system-ui; cursor:pointer; } button:disabled { opacity:.45; cursor:default; } #selection-status { color:var(--muted); font-size:14px; }
    #verification { margin-top:38px; } .checks { background:#fff; border:1px solid var(--line); border-radius:15px; overflow:hidden; } .check { padding:19px 23px; display:grid; grid-template-columns:100px 1fr; gap:18px; border-bottom:1px solid var(--line); } .check:last-child { border:0; }
    .badge { align-self:start; border-radius:5px; padding:3px 8px; font-size:12px; font-weight:700; text-align:center; background:#e5f2eb; color:#19583b; } .failed { background:#fdeceb; color:#943e35; } .unverified { background:#fff1d6; color:#735311; }
    .check strong { display:block; font-size:15px; } .evidence { margin:5px 0 0; color:var(--muted); font-size:13px; white-space:pre-wrap; overflow-wrap:anywhere; }
    footer { margin-top:28px; font-size:12px; color:var(--muted); } [hidden] { display:none!important; } #empty { padding:55px 0; color:var(--muted); }
    @media(max-width:560px) { main { padding:30px 18px; } header { padding:16px 18px; } .check { grid-template-columns:1fr; gap:8px; } .badge { justify-self:start; } h1 { letter-spacing:-1px; } }
  </style>
</head>
<body>
  <header><div class="brand">showwork<span>.</span></div><div id="connection" role="status">연결 중</div></header>
  <main>
    <div id="empty">곧 여기에서 화면과 설명을 함께 볼 수 있습니다.</div>
    <div id="content" hidden>
      <div id="mode" class="eyebrow"></div><h1 id="title"></h1><p id="summary"></p>
      <section id="decision" hidden aria-labelledby="question">
        <h2 id="question"></h2><div id="options" class="options" role="radiogroup" aria-labelledby="question"></div>
        <div class="decision-actions"><button id="submit" disabled>이 안으로 선택</button><span id="selection-status" role="status">화면을 선택한 뒤 버튼을 누르세요.</span></div>
      </section>
      <nav id="contents" aria-label="설명 목차" hidden></nav><div id="sections" class="section-grid"></div>
      <section id="verification" hidden><h2>확인한 것과 남은 것</h2><div id="checks" class="checks"></div></section>
      <footer id="footer"></footer>
    </div>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    let page = null, selected = null, connected = false, observers = [];
    function text(tag, content, className) { const e = document.createElement(tag); e.textContent = content; if(className) e.className=className; return e; }
    function visual(item, openOriginal=false) {
      if(item.image) {
        const img=document.createElement('img'); img.className='visual-image'; img.src=item.image; img.alt=item.title;
        if(!openOriginal) return img;
        const wrapper=document.createElement('div');const link=text('a',item.title+' · 원본 이미지 열기 (새 탭)','card-copy');
        link.href=item.image;link.target='_blank';link.rel='noopener';link.style.display='block';wrapper.append(img,link);return wrapper;
      }
      const frame=document.createElement('iframe'); frame.title=item.title; frame.setAttribute('sandbox','allow-same-origin');
      frame.srcdoc='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;padding:24px;font:15px/1.5 system-ui;color:#172f34;box-sizing:border-box;overflow-wrap:anywhere}*{box-sizing:border-box}svg{max-width:100%;height:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #d9e3e0;vertical-align:top}pre{white-space:pre-wrap}summary{cursor:pointer}</style>'+item.html;
      frame.onload=()=>{ try { const body=frame.contentDocument.body;const resize=()=>{const height=Math.max(260,Math.ceil(body.getBoundingClientRect().height)+2);frame.style.height=(page.mode==='handoff'?height:Math.min(760,height))+'px';};resize();const observer=new ResizeObserver(resize);observer.observe(body);observers.push(observer); } catch{} }; return frame;
    }
    function choose(id) {
      if(!connected) return;
      selected=id; document.querySelectorAll('.option').forEach(e=>e.setAttribute('aria-checked',String(e.dataset.choice===id)));
      $('submit').disabled=false; $('selection-status').textContent='선택 내용을 확인한 뒤 버튼을 누르세요.';
    }
    function render(next) {
      observers.forEach(observer=>observer.disconnect());observers=[];
      page=next; selected=null; $('empty').hidden=!!page; $('content').hidden=!page; if(!page) return;
      document.title=page.title+' · Showwork'; $('mode').textContent=page.mode==='decision'?'함께 결정하기':'작업 결과 살펴보기';
      $('title').textContent=page.title; $('summary').textContent=page.summary; $('decision').hidden=page.mode!=='decision';
      $('options').replaceChildren(); $('sections').replaceChildren(); $('checks').replaceChildren(); $('submit').disabled=true;
      $('contents').replaceChildren();$('contents').hidden=page.mode!=='handoff';$('sections').classList.toggle('handoff',page.mode==='handoff');
      $('selection-status').textContent='화면을 선택한 뒤 버튼을 누르세요.';
      if(page.mode==='decision') {
        $('question').textContent=page.question;
        page.options.forEach((item,i)=>{
          const card=document.createElement('div'); card.className='card option'; card.tabIndex=0; card.setAttribute('role','radio'); card.setAttribute('aria-checked','false'); card.dataset.choice=item.id; card.setAttribute('aria-label',item.title);
          card.append(visual(item)); const copy=document.createElement('div');copy.className='card-copy';copy.append(text('div','제안 '+(i+1),'tag'));
          const heading=text('h3','','option-label');heading.append(text('span','','radio'),text('span',item.title));copy.append(heading,text('p',item.body));card.append(copy);
          card.onclick=()=>choose(item.id);card.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();choose(item.id);}else if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();const offset=['ArrowRight','ArrowDown'].includes(e.key)?1:-1;const target=(i+offset+page.options.length)%page.options.length;choose(page.options[target].id);$('options').children[target].focus();}};
          $('options').append(card);
        });
      }
      const kinds={proposal:'구현 전 제안',observed:'실행 결과 · 작성자가 관찰',explanation:'이해를 위한 설명'};
      (page.sections||[]).forEach((item,index)=>{ const card=document.createElement('section');card.className='card';card.id='section-'+index;const copy=document.createElement('div');copy.className='card-copy';copy.append(text('div',kinds[item.kind],'tag'),text('h2',item.title),text('p',item.body));card.append(copy,visual(item,page.mode==='handoff'));$('sections').append(card);const link=text('a',item.title);link.href='#'+card.id;$('contents').append(link); });
      const labels={verified:'확인됨',failed:'실패',unverified:'미검증'};
      $('verification').hidden=!(page.checks||[]).length;
      (page.checks||[]).forEach(item=>{const row=document.createElement('div');row.className='check';row.append(text('span',labels[item.status],'badge '+item.status));const detail=document.createElement('div');detail.append(text('strong',item.text),text('p',item.evidence,'evidence'));row.append(detail);$('checks').append(row);});
      $('footer').textContent=page.mode==='decision'?'선택은 이 질문에만 적용됩니다. 추가 의견은 채팅에 남겨주세요.':'관찰 결과와 설명용 시각화를 구분했습니다. 검증 표시는 작성자가 제공한 근거를 기준으로 합니다.';
    }
    $('submit').onclick=async()=>{
      const version=page.version, choice=selected; $('submit').disabled=true;
      try { const response=await fetch('/api/choice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({version,choice})});if(!response.ok) throw new Error(response.status===409?'화면이 변경되었습니다. 최신 내용을 확인해주세요.':'선택을 저장하지 못했습니다.');
        if(page.version===version)$('selection-status').textContent='선택을 기록했습니다. 채팅에서 계속할 수 있습니다.';
      }catch(error){$('selection-status').textContent=error.message;if(page.version===version)$('submit').disabled=!connected;}
    };
    async function poll() { try {const response=await fetch('/api/view');if(!response.ok)throw new Error('connection');const data=await response.json();connected=true;$('connection').textContent='● 연결됨';if(data.page?.version!==page?.version)render(data.page);}catch{connected=false;$('connection').textContent='연결 끊김 · 마지막 화면';$('submit').disabled=true;}finally{setTimeout(poll,1000);} }
    // The first response sets an HttpOnly cookie; keep the key out of the address bar.
    if(location.search) history.replaceState(null,'',location.pathname);
    poll();
  </script>
</body>
</html>
