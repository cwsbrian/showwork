<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Showwork · Work in view</title>
  <link rel="stylesheet" href="/report-view.css">
  <style>
    header { background:#fff; border-bottom:1px solid var(--line); padding:19px max(24px,calc((100vw - 1180px)/2)); display:flex; justify-content:space-between; align-items:center; gap:18px; }
    .brand { font-size:21px; font-weight:800; letter-spacing:-.7px; } .brand span { color:var(--accent); } #connection { font-size:13px; color:var(--muted); }
    main { max-width:1236px; padding:48px 28px 80px; margin:auto; }
    #empty { padding:55px 0; color:var(--muted); }
    @media(max-width:560px) { main { padding:30px 18px; } header { padding:16px 18px; } }
  </style>
</head>
<body>
  <header><div class="brand">showwork<span>.</span></div><div id="connection" role="status">Connecting</div></header>
  <main>
    <div id="empty">Screens and explanations will appear here soon.</div>
    <div id="content" hidden></div>
  </main>
  <script type="module">
    import { renderReport } from '/report-view.js';
    const $ = id => document.getElementById(id);
    let page = null, view = null, connected = false;
    const hooks = {
      connected: () => connected,
      assetUrl: path => '/' + path,
      async submitChoice(choice) {
        // The version of the page this choice was made on; the server rejects it (409) if a newer page exists.
        const version = page.version;
        const response = await fetch('/api/choice', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({version, choice})});
        if(!response.ok) throw new Error(response.status===409?'The page has changed. Review the latest version.':'Could not save your choice.');
      }
    };
    function show(next) {
      view?.destroy(); view = null; page = next;
      $('empty').hidden = !!page; $('content').hidden = !page; if(!page) return;
      document.title = page.title + ' · Showwork';
      view = renderReport($('content'), page, hooks);
    }
    async function poll() { try {const response=await fetch('/api/view');if(!response.ok)throw new Error('connection');const data=await response.json();connected=true;$('connection').textContent='● Connected';if(data.page?.version!==page?.version)show(data.page);else view?.refresh();}catch{connected=false;$('connection').textContent='Disconnected · Last page';view?.refresh();}finally{setTimeout(poll,1000);} }
    // The first response sets an HttpOnly cookie; keep the key out of the address bar.
    if(location.search) history.replaceState(null,'',location.pathname);
    poll();
  </script>
</body>
</html>
