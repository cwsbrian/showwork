name: Release Showwork app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: showwork-main-release
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - run: npm ci
        working-directory: app
      - name: Set a new app version for this main commit
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const configPath = 'app/src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          const [major, minor] = config.version.split('.').map(Number);
          const version = `${major}.${minor}.${process.env.BUILD_NUMBER}`;
          config.version = version;
          fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + '\n');
          const packagePath = 'app/package.json';
          const packageInfo = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          packageInfo.version = version;
          fs.writeFileSync(packagePath, JSON.stringify(packageInfo, null, 2) + '\n');
          const lockPath = 'app/package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          lock.version = version;
          lock.packages[''].version = version;
          fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + '\n');
          const cargoPath = 'app/src-tauri/Cargo.toml';
          const cargo = fs.readFileSync(cargoPath, 'utf8');
          fs.writeFileSync(cargoPath, cargo.replace(/^version = "[^"]+"/m, `version = "${version}"`));
          console.log(`Building Showwork ${version} from ${process.env.GITHUB_SHA}`);
          JS
      - run: npm run build
        working-directory: app
      - run: cargo test --lib
        working-directory: app/src-tauri
      - name: Check whether this app version is already published
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if gh release view "app-v${version}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "App version ${version} is already published; bump the version to ship changes."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: tauri-apps/tauri-action@v1
        if: steps.release.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: app
          tagName: app-v__VERSION__
          releaseName: Showwork v__VERSION__
          releaseBody: 'Source commit: ${{ github.sha }}'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --target universal-apple-darwin --bundles app,dmg
